<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>

  <style>
    /* Style for the image container */
    .image-container {
      position: relative;
      width: 100%;
      height: 100vh; /* Full viewport height */
      background-image: url('{{ url_for('static', filename='images/WELCOMEPAGE1.png') }}');
      background-size: cover; /* Ensures the image covers the container */
      background-repeat: no-repeat; /* Prevents tiling of the image */
      background-position: center center; /* Centers the image */
      display: flex;
      justify-content: flex-end; /* Align buttons to the right */
      align-items: flex-end; /* Align buttons to the bottom */
      padding: 50px; /* Padding from edges */
      box-sizing: border-box;
      gap: 20px; /* Space between buttons */
    }

    /* Style for the Welcome buttons */
    .welcome-button {
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      background-color: bisque;
      color: brown;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
      text-decoration: none; /* Removes underline from the link */
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 150px;
      min-height: 50px;
    }

    /* Hover effect for the button */
    .welcome-button:hover {
      background-color: burlywood;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <a href="{{ url_for('signup') }}" class="welcome-button">SIGNUP</a>
    <a href="{{ url_for('login') }}" class="welcome-button">LOGIN</a>
  </div>
</body>
</html>
