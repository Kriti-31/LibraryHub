<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNUP - Library Hub</title>
<style>
body {font-family: Arial,sans-serif;background-image:url('{{ url_for('static', filename='images/library-bg.jpg') }}');background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.signup-container {background-color: rgba(255,255,255,0.9);padding:30px;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.1);width:320px;}
h2 {text-align:center;color:#333;margin-bottom:20px;}
.input-group {margin-bottom:15px;}
.input-group label {font-weight:bold;display:block;margin-bottom:5px;}
.input-group input {width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:14px;}
.login-btn {width:100%;padding:10px;background-color:burlywood;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer;transition:background-color 0.3s;}
.login-btn:hover {background-color:rgb(132,92,40);}
p{text-align:center;margin-top:15px;font-size:14px;}
p a{text-decoration:none;color:burlywood;}
p a:hover{text-decoration:underline;}
.error-msg{color:red;text-align:center;margin-bottom:10px;}
</style>
</head>
<body>
<div class="signup-container">
<h2>SIGN UP FOR LIBRARY HUB</h2>
<form id="signup-form" onsubmit="return validateForm()" action="{{ url_for('signup') }}" method="POST">
{% if message %}
<div class="error-msg">{{ message }}</div>
{% endif %}
<div class="input-group">
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" required>
</div>
<div class="input-group">
<label for="username">Username:</label>
<input type="text" id="username" name="username" required>
</div>
<div class="input-group">
<label for="email">Email:</label>
<input type="email" id="email" name="email" required>
</div>
<div class="input-group">
<label for="password">Password:</label>
<input type="password" id="password" name="password" required>
</div>
<div class="input-group">
<label for="confirm-password">Confirm Password:</label>
<input type="password" id="confirm-password" name="confirm-password" required>
</div>
<button type="submit" class="login-btn">Sign Up</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
<script>
function validateForm() {
const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirm-password").value;
if(password !== confirmPassword){alert("Passwords do not match!");return false;}
return true;
}
</script>
</body>
</html>
