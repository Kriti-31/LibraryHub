<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get In Touch - Library Management System</title>

  <!-- CSS link -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/getintouch.css') }}">
</head>

<body>
  <div class="contact-container">
    <h2>Get In Touch</h2>

    <!-- Flask form -->
    <form action="{{ url_for('get_in_touch_page') }}" method="post">
      <div class="input-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required pattern="[0-9]{10}">
      </div>

      <div class="input-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Enter your message or query" required></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
